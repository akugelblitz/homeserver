networks:
  backbone-network:
    name: backbone-network
    external: true

volumes:
  hoarder_data:
  hoarder_meilisearch:

services:
  hoarder:
    image: ghcr.io/karakeep-app/karakeep:${HOARDER_VERSION:-release}
    container_name: "hoarder"
    restart: unless-stopped
    networks:
      - backbone-network
    volumes:
      - hoarder_data:/data
    environment:
      MEILI_ADDR: http://hoarder_meilisearch:7700
      BROWSER_WEB_URL: http://hoarder_chrome:9222
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INFERENCE_IMAGE_MODEL: gpt-4o-mini
      INFERENCE_TEXT_MODEL: gpt-4o-mini
      DATA_DIR: /data
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      NEXTAUTH_URL: hoarder.${ROOT_FQDN}
      NEXTAUTH_URL_INTERNAL: http://localhost:3000
      DISABLE_PASSWORD_AUTH: true
      OAUTH_WELLKNOWN_URL: https://auth.${ROOT_FQDN}/.well-known/openid-configuration
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_PROVIDER_NAME: authelia
      TZ: ${TZ}
    labels:
      meta.name: "hoarder"
      meta.stack: ${STACK}
      traefik.enable: "true"
      traefik.http.services.hoarder.loadbalancer.server.port: "3000"
      traefik.http.routers.hoarder.rule: "Host(`hoarder.${ROOT_FQDN}`)"
      traefik.http.routers.hoarder.entrypoints: "websecure"
      traefik.http.routers.hoarder.tls: "true"
      glance.name: Hoarder
      glance.icon: /assets/hoarder.png
      glance.url: https://hoarder.${ROOT_FQDN}
      glance.description: Bookmarks
      glance.id: hoarder

  hoarder_chrome:
    image: gcr.io/zenika-hub/alpine-chrome:${CHROME_VERSION:-latest}
    container_name: "hoarder_chrome"
    restart: unless-stopped
    networks:
      - backbone-network
    environment:
      TZ: ${TZ}
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    labels:
      meta.name: "hoarder_chrome"
      meta.stack: ${STACK}
      glance.name: Hoarder Chrome
      glance.icon: /assets/googlechrome.svg
      glance.description: Chrome for Hoarder
      glance.parent: hoarder

  hoarder_meilisearch:
    image: getmeili/meilisearch:${MEILISEARCH_VERSION:-latest}
    container_name: "hoarder_meilisearch"
    restart: unless-stopped
    networks:
      - backbone-network
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      TZ: ${TZ}
    volumes:
      - hoarder_meilisearch:/meili_data
    labels:
      meta.name: "hoarder_meilisearch"
      meta.stack: ${STACK}
      glance.name: Hoarder Meilisearch
      glance.icon: /assets/meilisearch.svg
      glance.description: Meilisearch for Hoarder
      glance.parent: hoarder
