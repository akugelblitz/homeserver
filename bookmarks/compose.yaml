networks:
  backbone-network:
    name: backbone-network
    external: true

volumes:
  karakeep_data:
  karakeep_meilisearch:

services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION:-release}
    container_name: "karakeep"
    restart: unless-stopped
    networks:
      - backbone-network
    volumes:
      - karakeep_data:/data
    environment:
      MEILI_ADDR: http://karakeep_meilisearch:7700
      BROWSER_WEB_URL: http://karakeep_chrome:9222
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INFERENCE_IMAGE_MODEL: gpt-4o-mini
      INFERENCE_TEXT_MODEL: gpt-4o-mini
      DATA_DIR: /data
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      NEXTAUTH_URL: "https://karakeep.kugelblitz.cc"
      NEXTAUTH_URL_INTERNAL: http://localhost:3000
      DISABLE_PASSWORD_AUTH: true
      OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: true
      OAUTH_WELLKNOWN_URL: https://auth.${ROOT_FQDN}/.well-known/openid-configuration
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_PROVIDER_NAME: authelia
      OAUTH_SCOPE: "openid email profile"
      TZ: ${TZ}
      ASSET_STORE_S3_ENDPOINT: ${ASSET_STORE_S3_ENDPOINT}
      ASSET_STORE_S3_ACCESS_KEY_ID: ${ASSET_STORE_S3_ACCESS_KEY_ID}
      ASSET_STORE_S3_SECRET_ACCESS_KEY: ${ASSET_STORE_S3_SECRET_ACCESS_KEY}
      ASSET_STORE_S3_BUCKET: ${ASSET_STORE_S3_BUCKET}
      ASSET_STORE_S3_FORCE_PATH_STYLE: "true"
      ASSET_STORE_S3_REGION: "us-east-1"
    labels:
      meta.name: "karakeep"
      meta.stack: ${STACK}
      traefik.enable: "true"
      traefik.http.services.karakeep.loadbalancer.server.port: "3000"
      traefik.http.routers.karakeep.rule: "Host(`karakeep.${ROOT_FQDN}`)"
      traefik.http.routers.karakeep.entrypoints: "websecure"
      traefik.http.routers.karakeep.tls: "true"
      glance.name: Karakeep
      glance.icon: /assets/karakeep.png
      glance.url: https://karakeep.${ROOT_FQDN}
      glance.description: Bookmarks
      glance.id: karakeep

  karakeep_chrome:
    image: gcr.io/zenika-hub/alpine-chrome:${CHROME_VERSION:-latest}
    container_name: "karakeep_chrome"
    restart: unless-stopped
    networks:
      - backbone-network
    environment:
      TZ: ${TZ}
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    labels:
      meta.name: "karakeep_chrome"
      meta.stack: ${STACK}
      glance.name: Karakeep Chrome
      glance.icon: /assets/googlechrome.svg
      glance.description: Chrome for Karakeep
      glance.parent: karakeep

  karakeep_meilisearch:
    image: getmeili/meilisearch:${MEILISEARCH_VERSION:-latest}
    container_name: "karakeep_meilisearch"
    restart: unless-stopped
    networks:
      - backbone-network
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      TZ: ${TZ}
    volumes:
      - karakeep_meilisearch:/meili_data
    labels:
      meta.name: "karakeep_meilisearch"
      meta.stack: ${STACK}
      glance.name: Karakeep Meilisearch
      glance.icon: /assets/meilisearch.svg
      glance.description: Meilisearch for Karakeep
      glance.parent: karakeep
