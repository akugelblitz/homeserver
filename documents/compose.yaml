networks:
  backbone-network:
    name: backbone-network
    external: true

volumes:
  papra_data:

services:
  papra:
    image: ghcr.io/papra-hq/papra:${PAPRA_VERSION:-latest}
    container_name: papra
    restart: unless-stopped
    networks:
      - backbone-network
    volumes:
      - ./app-data:/app/app-data
      - ./ingestion:/app/ingestion
    user: "${UID}:${GID}"
    environment:
      APP_BASE_URL: "https://papra.${ROOT_FQDN}"
      DOCUMENT_STORAGE_DRIVER: s3
      DOCUMENT_STORAGE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      DOCUMENT_STORAGE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      DOCUMENT_STORAGE_S3_ENDPOINT: ${S3_ENDPOINT}
      DOCUMENT_STORAGE_S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      DOCUMENT_STORAGE_S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE}"
      DOCUMENT_STORAGE_S3_REGION: "${S3_REGION}"
      AUTH_SECRET: ${AUTH_SECRET}
      INGESTION_FOLDER_IS_ENABLED: true
    healthcheck:
      #test: curl --fail -s http://127.0.0.1:1221/healthcheck || exit 1
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/1221' || exit 1
      interval: 30s
      timeout: 15s
      retries: 3
    labels:
      meta.name: "papra"
      meta.stack: ${STACK}
      traefik.enable: "true"
      traefik.http.services.papra.loadbalancer.server.port: "1221"
      traefik.http.routers.papra.rule: "Host(`papra.${ROOT_FQDN}`)"
      traefik.http.routers.papra.entrypoints: "websecure"
      traefik.http.routers.papra.tls: "true"
      traefik.http.routers.papra.middlewares: "authelia@docker"
      glance.name: papra
      glance.icon: /assets/paprangx.svg
      glance.url: https://papra.${ROOT_FQDN}
      glance.description: Document Management
