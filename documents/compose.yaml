networks:
  backbone-network:
    name: backbone-network
    external: true

volumes:
  paperless_data:

services:
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_VERSION:-latest}
    container_name: paperless
    restart: unless-stopped
    networks:
      - backbone-network
    expose:
      - 8000
    volumes:
      - paperless_data:/usr/src/paperless/data
      - ${PAPERLESS_BASE_PATH}/media:/usr/src/paperless/media
      - ${PAPERLESS_BASE_PATH}/export:/usr/src/paperless/export
      - ${PAPERLESS_BASE_PATH}/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://redis:6379/1
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      USERMAP_UID: 1000
      USERMAP_GID: 1000
      PAPERLESS_ADMIN_USER: ${ADMIN_USER}
      PAPERLESS_ADMIN_MAIL: ${ADMIN_EMAIL}
      PAPERLESS_ADMIN_PASSWORD: ${ADMIN_PASS}
      PAPERLESS_SECRET_KEY: 6eKz1nYhNmpf8w3HoMeCdnIoUqCF8Q1aif3BGks74pU
      PAPERLESS_URL: https://paperless.${ROOT_FQDN}
      PAPERLESS_ALLOWED_HOSTS: localhost,paperless.${ROOT_FQDN},127.0.0.1:8000
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: true
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_REMOTE_USER
      PAPERLESS_LOGOUT_REDIRECT_URL: https://auth.${ROOT_FQDN}/logout
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      meta.name: 'paperless'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.paperless.loadbalancer.server.port: '8000'
      traefik.http.routers.paperless.rule: 'Host(`paperless.${ROOT_FQDN}`)'
      traefik.http.routers.paperless.entrypoints: 'websecure'
      traefik.http.routers.paperless.tls: 'true'
      traefik.http.routers.paperless.middlewares: 'authelia@docker'
      glance.name: Paperless
      glance.icon: /assets/paperlessngx.svg
      glance.url: https://paperless.${ROOT_FQDN}
      glance.description: Document Management
