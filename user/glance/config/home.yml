        #       subreddit: technology
        #       show-thumbnails: true
        #     - type: reddit
        #       subreddit: selfhosted
        #       show-thumbnails: true

    - size: small
      widgets:
        - type: clock
          hour-format: 24h
          timezones:
            - timezone: Europe/Paris
              label: Paris
            - timezone: America/New_York
              label: New York
            - timezone: Asia/Tokyo
              label: Tokyo

        - type: dns-stats
          service: adguard
          url: http://adguard:3000
          username: ${ADGUARD_USER}
          password: ${ADGUARD_PASS}

        - type: repository
          repository: akugelblitz/obsidian-notes
          token: ${GITHUB_TOKEN}
          pull-requests-limit: 5
          issues-limit: 3
          commits-limit: 3

        - type: repository
          repository: akugelblitz/homeserver
          token: ${GITHUB_TOKEN}
          pull-requests-limit: 5
          issues-limit: 3
          commits-limit: 3

        - type: releases
          cache: 1d
          show-source-icon: true
          token: ${GITHUB_TOKEN}
          repositories:
            - glanceapp/glance
            - go-gitea/gitea
            - immich-app/immich
            # - akugelblitz/obsidian-notes
            # - akugelblitz/homeserver

