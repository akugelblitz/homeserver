networks:
  backbone-network:
    name: ${BACKBONE_STACK}
    external: true

volumes:
  jellyfin_config:
  jellyfin_cache:
  open_webui_data:
  maybe_data:
  paperless_data:
  livesync_data:
  livesync_etc:

services:
  whoami:
    image: "traefik/whoami:v1.11"
    container_name: "whoami"
    restart: "unless-stopped"
    networks:
      - backbone-network
    labels:
      meta.name: "whoami"
      meta.stack: ${STACK}
      traefik.enable: "true"
      traefik.http.services.whoami.loadbalancer.server.port: "80"
      traefik.http.routers.whoami.rule: "Host(`whoami.${ROOT_FQDN}`)"
      traefik.http.routers.whoami.entrypoints: "websecure"
      traefik.http.routers.whoami.tls: "true"
      glance.name: Whoami
      glance.hide: true

  jellyfin:
    image: jellyfin/jellyfin:10.11
    container_name: "jellyfin"
    restart: unless-stopped
    networks:
      - backbone-network
    user: 1000:1000
    group_add:
      - "989"
    volumes:
      - "jellyfin_config:/config"
      - "jellyfin_cache:/cache"
      - "${MEDIA_DIRECTORY}:/media"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card0
    environment:
      - TZ=${TZ}
      # - JELLYFIN_PublishedServerUrl=${JELLYFIN_URL}  # Include protocol prefix (e.g. `https://)
      # - HEALTHCHECK_URL=http://localhost:80/health  # Change the server's jellyfleet port to 8096 here or to 80 in /config/config/network.xml
    labels:
      traefik.enable: "true"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.${ROOT_FQDN}`)"
      traefik.http.routers.jellyfin.entrypoints: "websecure"
      traefik.http.routers.jellyfin.tls: "true"

