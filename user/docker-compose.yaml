  open_webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: 'open_webui'
    restart: unless-stopped
    networks:
    - backbone-network
    volumes:
      - "open_webui_data:/app/backend/data"
    environment:
      TZ: ${TZ}
      WEBUI_URL: chat.${ROOT_FQDN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      ENABLE_OAUTH_SIGNUP: 'true'
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: 'true'
      OAUTH_CLIENT_ID: ${OPEN_WEBUI_OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OPEN_WEBUI_OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: 'https://auth.kugel.homes/.well-known/openid-configuration'
      OAUTH_PROVIDER_NAME: 'Authelia'
      OAUTH_SCOPES: 'openid email profile groups'
      DEFAULT_USER_ROLE: user
      # ENABLE_OAUTH_ROLE_MANAGEMENT: 'true'
      # OAUTH_ALLOWED_ROLES: 'openwebui,openwebui-admin'
      # OAUTH_ADMIN_ROLES: 'openwebui-admin'
      # OAUTH_ROLES_CLAIM: 'groups'

    labels:
      traefik.enable: 'true'
      traefik.http.services.chat.loadbalancer.server.port: '8080'
      traefik.http.routers.chat.rule: 'Host(`chat.${ROOT_FQDN}`)'
      traefik.http.routers.chat.entrypoints: 'websecure'
      traefik.http.routers.chat.tls: 'true'

  firefly:
    image: fireflyiii/core:latest
    container_name: firefly
    restart: unless-stopped
    networks:
    - backbone-network
    volumes:
      - firefly_data:/var/www/html/storage/upload
    environment:
      APP_ENV: production
      APP_DEBUG: false
      SITE_OWNER: ${ADMIN_EMAIL}
      APP_KEY: ${FIREFLY_APP_KEY}
      DEFAULT_LANGUAGE: en_US
      DEFAULT_LOCALE: equal
      TZ: ${TZ}
      TRUSTED_PROXIES: "**"
      LOG_CHANNEL: stack
      APP_LOG_LEVEL: notice
      AUDIT_LOG_LEVEL: emergency
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: firefly
      PGSQL_SSL_MODE: prefer
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      COOKIE_PATH: "/"
      COOKIE_SECURE: false
      COOKIE_SAMESITE: lax
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: null
      SEND_ERROR_MESSAGE: true
      SEND_REPORT_JOURNALS: true
      AUTHENTICATION_GUARD: web
      AUTHENTICATION_GUARD_HEADER: HTTP_REMOTE_USER
      DISABLE_FRAME_HEADER: false
      DISABLE_CSP_HEADER: false
      ALLOW_WEBHOOKS: true
      APP_URL: https://firefly.${ROOT_FQDN}
    labels:
      traefik.enable: 'true'
      traefik.http.services.firefly.loadbalancer.server.port: '8080'
      traefik.http.routers.firefly.rule: 'Host(`firefly.${ROOT_FQDN}`)'
      traefik.http.routers.firefly.entrypoints: 'websecure'
      traefik.http.routers.firefly.tls: 'true'
      # traefik.http.routers.firefly.middlewares: 'authelia@docker'


  pico:
    image: cioraneanu/firefly-pico:latest
    container_name: pico
    restart: unless-stopped
    networks:
    - backbone-network
    volumes:
      - firefly_data:/var/www/html/storage/upload
    environment:
      FIREFLY_URL: http://firefly:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pico
      DB_USERNAME: pico
      DB_PASSWORD: pico
      TZ: ${TZ}
    labels:
      traefik.enable: 'true'
      traefik.http.services.pico.loadbalancer.server.port: '80'
      traefik.http.routers.pico.rule: 'Host(`pico.${ROOT_FQDN}`)'
      traefik.http.routers.pico.entrypoints: 'websecure'
      traefik.http.routers.pico.tls: 'true'
  
  glance:
    image: glanceapp/glance
    container_name: glance
    restart: unless-stopped
    networks:
    - backbone-network
    environment:
      TZ: ${TZ}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    env_file: glance.env
    volumes:
      - ./glance/config:/app/config
      - ./glance/assets:/app/assets
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      traefik.enable: 'true'
      traefik.http.services.glance.loadbalancer.server.port: '8080'
      traefik.http.routers.glance.rule: 'Host(`glance.${ROOT_FQDN}`)'
      traefik.http.routers.glance.entrypoints: 'websecure'
      traefik.http.routers.glance.tls: 'true'


