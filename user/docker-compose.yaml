include:
  - immich-docker-compose.yaml
  - hoarder-docker-compose.yaml

networks:
  backbone-network:
    name: ${BACKBONE_STACK}
    external: true
          

volumes:
  jellyfin_config:
  jellyfin_cache:
  open_webui_data:
  maybe_data:
  paperless_data:


services:    
  maybe:
    image: ghcr.io/maybe-finance/maybe:latest
    container_name: 'maybe'
    restart: unless-stopped
    volumes:
      - maybe_data:/rails/storage
    networks:
    - backbone-network 
    environment:
      TZ: ${TZ}
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "false"
      GOOD_JOB_EXECUTION_MODE: async
      SECRET_KEY_BASE: ${MAYBE_SECRET_KEY_BASE:?}
      DB_HOST: postgres
      POSTGRES_DB: maybe
      POSTGRES_USER: maybe
      POSTGRES_PASSWORD: maybe
      SMTP_ADDRESS: ${MAIL_HOST}
      SMTP_PORT: ${MAIL_PORT}
      SMTP_USERNAME: ${MAIL_USERNAME}
      SMTP_PASSWORD: ${MAIL_PASSWORD}
      SMTP_TLS_ENABLED: true
    labels:
      meta.name: 'maybe'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.maybe.loadbalancer.server.port: '3000'
      traefik.http.routers.maybe.rule: 'Host(`maybe.${ROOT_FQDN}`)'
      traefik.http.routers.maybe.entrypoints: 'websecure'
      traefik.http.routers.maybe.tls: 'true'

  
  whoami:
    image: 'traefik/whoami'
    container_name: 'whoami'
    restart: 'unless-stopped'
    networks:
    - backbone-network    
    labels:
      meta.name: 'whoami'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.whoami.loadbalancer.server.port: '80'
      traefik.http.routers.whoami.rule: 'Host(`whoami.${ROOT_FQDN}`)'
      traefik.http.routers.whoami.entrypoints: 'websecure'
      traefik.http.routers.whoami.tls: 'true'
      # traefik.http.routers.whoami.middlewares: 'authelia@docker'

