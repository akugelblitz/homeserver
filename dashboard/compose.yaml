networks:
  backbone-network:
    name: backbone-network
    external: true

services:
  glance:
    image: glanceapp/glance:${GLANCE_VERSION:-latest}
    container_name: glance
    restart: unless-stopped
    networks:
      - backbone-network
    environment:
      TZ: ${TZ}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ADGUARD_USER: ${ADMIN_USER}
      ADGUARD_PASS: ${ADMIN_PASS}
    volumes:
      - ./glance/config:/app/config
      - ./glance/assets:/app/assets
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      meta.name: "glance"
      meta.stack: ${STACK}
      traefik.enable: "true"
      traefik.http.services.glance.loadbalancer.server.port: "8080"
      traefik.http.routers.glance.rule: "Host(`glance.${ROOT_FQDN}`)"
      traefik.http.routers.glance.entrypoints: "websecure"
      traefik.http.routers.glance.tls: "true"
      glance.name: Glance
      glance.icon: /assets/glance.png
      glance.url: https://glance.${ROOT_FQDN}
      glance.description: Dashboard
