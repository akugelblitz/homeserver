networks:
  backbone-network:
    name: backbone-network
    attachable: true
    driver: bridge

volumes:
  tailscale_data:
  traefik_certs:
  adguard_data:

services:
  tailscale:
    image: tailscale/tailscale:${TS_VERSION:-latest}
    container_name: tailscale
    hostname: traefik
    restart: unless-stopped
    networks:
      - backbone-network
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
      TZ: ${TZ}
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      meta.name: 'tailscale'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.routers.traefik.rule: 'Host(`traefik.${ROOT_FQDN}`)'
      traefik.http.routers.traefik.entrypoints: 'websecure'
      traefik.http.routers.traefik.service: 'api@internal'
      traefik.http.services.traefik.loadbalancer.server.port: '8080'
      traefik.http.routers.traefik.tls: 'true'
      traefik.http.routers.traefik.tls.certresolver: 'letsencrypt'
      traefik.http.routers.traefik.tls.domains[0].main: '${ROOT_FQDN}'
      traefik.http.routers.traefik.tls.domains[0].sans: '*.${ROOT_FQDN}'
      glance.name: Tailscale
      glance.icon: /assets/tailscale.svg
      glance.description: VPN

  traefik:
    image: traefik:${TRAEFIK_VERSION:-latest}
    container_name: 'traefik'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    network_mode: "service:tailscale"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yaml:/etc/traefik/traefik.yaml
      - traefik_certs:/certs
    environment:
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      TZ: ${TZ}
    labels:
      meta.name: 'traefik'
      meta.stack: ${STACK}
      glance.name: Traefik
      glance.icon: /assets/traefikproxy.svg
      glance.url: https://traefik.${ROOT_FQDN}
      glance.description: Reverse Proxy

  whoami:
    image: 'traefik/whoami:${WHOAMI_VERSION:-latest}'
    container_name: 'whoami'
    restart: 'unless-stopped'
    networks:
      - backbone-network
    labels:
      meta.name: 'whoami'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.whoami.loadbalancer.server.port: '80'
      traefik.http.routers.whoami.rule: 'Host(`whoami.${ROOT_FQDN}`)'
      traefik.http.routers.whoami.entrypoints: 'websecure'
      traefik.http.routers.whoami.tls: 'true'
      glance.name: Whoami
      glance.hide: true

  adguard:
    image: adguard/adguardhome:${ADGUARD_VERSION:-latest}
    container_name: adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    networks:
      - backbone-network
    volumes:
      - adguard_data:/opt/adguardhome
    labels:
      meta.name: 'adguard'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.adguard.loadbalancer.server.port: '3000'
      traefik.http.routers.adguard.rule: 'Host(`dns.${ROOT_FQDN}`)'
      traefik.http.routers.adguard.entrypoints: 'websecure'
      traefik.http.routers.adguard.tls: 'true'
      glance.name: AdGuard
      glance.icon: /assets/adguard.svg
      glance.url: https://dns.${ROOT_FQDN}
      glance.description: DNS
