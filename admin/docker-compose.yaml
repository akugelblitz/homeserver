networks:
  backcone-network:
    name: ${BACKBONE_STACK}
    external: true
          

volumes:
  portainer_data:
  uptime_kuma_data:


services:
  portainer:
    image: portainer/portainer-ce:2.24.0-alpine
    container_name: 'portainer'
    restart: unless-stopped
    networks:
    - backcone-network
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ}
    labels:
      meta.name: 'portainer'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.portainer.loadbalancer.server.port: '9000'
      traefik.http.routers.portainer.rule: 'Host(`portainer.${ROOT_FQDN}`)'
      traefik.http.routers.portainer.entrypoints: 'websecure'
      traefik.http.routers.portainer.tls: 'true'

  postgres:
    image: postgres:16.3
    container_name: 'postgres'
    restart: unless-stopped
    networks:
    - backcone-network
    # ports:
    #   - 5432:5432
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${ADMIN_USER}
      POSTGRES_PASSWORD: ${ADMIN_PASS}
      TZ: ${TZ}
    labels:
      meta.name: 'postgres'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.tcp.services.postgres.loadbalancer.server.port: '5432'
      traefik.tcp.routers.postgres.rule: 'HostSNI(`postgres.${ROOT_FQDN}`)'
      traefik.tcp.routers.postgres.entrypoints: 'db'
      traefik.tcp.routers.postgres.tls: 'true'
      traefik.tcp.routers.postgres.tls.certresolver: 'letsencrypt'

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: 'pgadmin'
    restart: unless-stopped
    networks:
    - backcone-network
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      TZ: ${TZ}
    labels:
      meta.name: 'pdadmin'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.pgadmin.loadbalancer.server.port: '80'
      traefik.http.routers.pgadmin.rule: 'Host(`pgadmin.${ROOT_FQDN}`)'
      traefik.http.routers.pgadmin.entrypoints: 'websecure'
      traefik.http.routers.pgadmin.tls: 'true'
  

  

