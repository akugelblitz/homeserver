networks:
  backbone-network:
    name: ${BACKBONE_STACK}
    external: true
          

volumes:
  portainer_data:
  uptime_kuma_data:
  beszel_data:

services:
  portainer:
    image: portainer/portainer-ce:2.24.0-alpine
    container_name: 'portainer'
    restart: unless-stopped
    networks:
    - backbone-network
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ}
    labels:
      meta.name: 'portainer'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.portainer.loadbalancer.server.port: '9000'
      traefik.http.routers.portainer.rule: 'Host(`portainer.${ROOT_FQDN}`)'
      traefik.http.routers.portainer.entrypoints: 'websecure'
      traefik.http.routers.portainer.tls: 'true'


  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: 'kuma'
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
    - backbone-network 
    environment:
      TZ: ${TZ}
      HOST: 
    labels:
      meta.name: 'uptime-kuma'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.kuma.loadbalancer.server.port: '3001'
      traefik.http.routers.kuma.rule: 'Host(`kuma.${ROOT_FQDN}`)'
      traefik.http.routers.kuma.entrypoints: 'websecure'
      traefik.http.routers.kuma.tls: 'true'
      

     
  

  beszel:
    image: 'henrygd/beszel:latest' 
    container_name: 'beszel'

    restart: unless-stopped
    # depends_on:
    #   - tailscale
    # network_mode: service:tailscale
    networks:
    - backbone-network
    volumes:
      - beszel_data:/beszel_data
    # extra_hosts:
    #   - 'host.docker.internal:host-gateway'
      # - 'gotify.${ROOT_FQDN}:${TRAEFIK_IP}'
    environment:
      TZ: ${TZ}
      LOG_LEVEL: debug
      USER_CREATION: true
    labels:
      meta.name: 'beszel'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.beszel.loadbalancer.server.port: '8090'
      traefik.http.routers.beszel.rule: 'Host(`beszel.${ROOT_FQDN}`)'
      traefik.http.routers.beszel.entrypoints: 'websecure'
      traefik.http.routers.beszel.tls: 'true'
      traefik.http.routers.beszel.service: 'beszel'


  beszel-agent:
    image: 'henrygd/beszel-agent:latest'
    container_name: 'beszel-agent'
    hostname: ${HOSTNAME}
    restart: unless-stopped
    networks:
    - backbone-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: 45876 
      KEY: ${BESZEL_PUBLIC_KEY}
      LOG_LEVEL: debug
      TZ: ${TZ}
    labels:
      meta.name: 'beszel-agent'
      meta.stack: ${STACK}


    

  


  


