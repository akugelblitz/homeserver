networks:
  admin-network:
    name: admin_net
    attachable: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${ADMIN_NET_SUBNET}
          ip_range: ${ADMIN_NET_SUBNET}
          

volumes:
  tailscale_data:
  portainer_data:
  beszel_data:
  postgres_data:
  gotify_data:
  hoarder_data:
  hoarder_meilisearch:


services:
  tailscale-traefik:
    image: tailscale/tailscale:v1.76.6
    container_name: tailscale
    hostname: traefik
    restart: unless-stopped
    networks:
    - admin-network
    ports:
    - "80:80"
    - "443:443"
    - "8080:8080"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      - "meta.name=tailscale"
      - "meta.stack=admin"
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${ROOT_FQDN}`) "
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.services.traefik.loadbalancer.server.port=8080"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.tls.domains[0].main=$ROOT_FQDN"
      - "traefik.http.routers.traefik.tls.domains[0].sans=*.$ROOT_FQDN"
  traefik:
    image: traefik:v3.1.7
    container_name: 'traefik'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - tailscale-traefik
    network_mode: service:tailscale-traefik
    # ports:
    #   - "80:80"
    #   - "443:443"
    #   - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yaml:/etc/traefik/traefik.yaml
      # - ./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml
      # - ./traefik/acme.json:/acme.json
      # - ./traefik/traefik.log:/traefik.log
    environment:
      TZ: ${TZ}
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    labels:
      - "meta.name=traefik"
      - "meta.stack=admin"
      # - "traefik.enable=true"
      # - "traefik.http.routers.traefik.rule=Host(`traefik.${ROOT_FQDN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      # - "traefik.http.routers.traefik.entrypoints=websecure"
      # # - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.traefik.service=api@internal"
      # - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  portainer:
    image: portainer/portainer-ce:2.24.0-alpine
    container_name: 'portainer'
    restart: unless-stopped
    networks:
    - admin-network
    # ports:
    #   - 9000:9000
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ}
    labels:
      - "meta.name=portainer"
      - "meta.stack=admin"
      - "traefik.enable=true"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${ROOT_FQDN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"

