  beszel:
    image: 'henrygd/beszel:latest@sha256:f22a9a86a6909391c47418a08700721645bc983e74a70e3d58ac013fa392dd84' 
    container_name: 'beszel'
    restart: unless-stopped
    networks:
    - backcone-network
    volumes:
      - beszel_data:/beszel_data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      # - 'gotify.${ROOT_FQDN}:${TRAEFIK_IP}'
    environment:
      TZ: ${TZ}
    labels:
      meta.name: 'beszel'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.beszel.loadbalancer.server.port: '8090'
      traefik.http.routers.beszel.rule: 'Host(`beszel.${ROOT_FQDN}`)'
      traefik.http.routers.beszel.entrypoints: 'websecure'
      traefik.http.routers.beszel.tls: 'true'

  beszel-agent:
    image: 'henrygd/beszel-agent'
    container_name: 'beszel-agent'
    restart: unless-stopped
