networks:
  admin-network:
    name: admin_net
    attachable: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${ADMIN_NET_SUBNET}
          ip_range: ${ADMIN_NET_SUBNET}
          

volumes:
  tailscale_data:
  traefik_certs:
  portainer_data:
  beszel_data:
  postgres_data:
  gotify_data:
  hoarder_data:
  hoarder_meilisearch:


services:
  tailscale-traefik:
    image: tailscale/tailscale:v1.76.6
    container_name: tailscale
    hostname: traefik
    restart: unless-stopped
    networks:
    - admin-network
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
      TZ: ${TZ}
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      meta.name: 'tailscale'
      meta.stack: 'admin'
      traefik.enable: 'true'
      traefik.http.routers.traefik.rule: 'Host(`traefik.${ROOT_FQDN}`) '
      traefik.http.routers.traefik.entrypoints: 'websecure'
      traefik.http.routers.traefik.service: 'api@internal'
      traefik.http.services.traefik.loadbalancer.server.port: '8080'
      traefik.http.routers.traefik.tls: 'true'
      traefik.http.routers.traefik.tls.certresolver: 'letsencrypt'
      traefik.http.routers.traefik.tls.domains[0].main: '$ROOT_FQDN'
      traefik.http.routers.traefik.tls.domains[0].sans: '*.$ROOT_FQDN'
      # Authelia
      traefik.http.routers.traefik.middlewares: 'authelia@docker'
      traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth'
      ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest this is
      ## configured in the Session Cookies section of the Authelia configuration.
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F'
      traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Email,Remote-Name'
      
  traefik:
    image: traefik:v3.2.3
    container_name: 'traefik'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - tailscale-traefik
      - authelia
    network_mode: service:tailscale-traefik
    # ports:
    #   - "80:80"
    #   - "443:443"
    #   - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yaml:/etc/traefik/traefik.yaml
      - traefik_certs:/certs
      # - ./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml
      # - ./traefik/acme.json:/acme.json
      # - ./traefik/traefik.log:/traefik.log
    environment:
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      TZ: ${TZ}
    labels:
      meta.name: 'traefik'
      meta.stack: 'admin'
      # traefik.enable: 'true'
      # traefik.http.routers.traefik.rule: 'Host(`traefik.${ROOT_FQDN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      # traefik.http.routers.traefik.entrypoints: 'websecure'
      # # traefik.http.routers.traefik.tls.certresolver: 'letsencrypt'
      # traefik.http.routers.traefik.service: 'api@internal'
      # traefik.http.services.traefik.loadbalancer.server.port: '8080'

      # Authelia
      # traefik.http.routers.api.middlewares: 'authelia@docker'
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth'
      # ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest this is
      # ## configured in the Session Cookies section of the Authelia configuration.
      # # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F'
      # traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      # traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Email,Remote-Name'

  portainer:
    image: portainer/portainer-ce:2.24.0-alpine
    container_name: 'portainer'
    restart: unless-stopped
    networks:
    - admin-network
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ}
    labels:
      meta.name: 'portainer'
      meta.stack: 'admin'
      traefik.enable: 'true'
      traefik.http.services.portainer.loadbalancer.server.port: '9000'
      traefik.http.routers.portainer.rule: 'Host(`portainer.${ROOT_FQDN}`)'
      traefik.http.routers.portainer.entrypoints: 'websecure'
      traefik.http.routers.portainer.tls: 'true'

  beszel:
    image: 'henrygd/beszel:latest@sha256:f22a9a86a6909391c47418a08700721645bc983e74a70e3d58ac013fa392dd84' 
    container_name: 'beszel'
    restart: unless-stopped
    networks:
    - admin-network
    volumes:
      - beszel_data:/beszel_data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      # - 'gotify.${ROOT_FQDN}:${TRAEFIK_IP}'
    environment:
      TZ: ${TZ}
    labels:
      meta.name: 'beszel'
      meta.stack: 'admin'
      traefik.enable: 'true'
      traefik.http.services.beszel.loadbalancer.server.port: '8090'
      traefik.http.routers.beszel.rule: 'Host(`beszel.${ROOT_FQDN}`)'
      traefik.http.routers.beszel.entrypoints: 'websecure'
      traefik.http.routers.beszel.tls: 'true'

  beszel-agent:
    image: 'henrygd/beszel-agent'
    container_name: 'beszel-agent'
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: 45876 
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINeO2vsk7775NqlhryY7R6PidFCCZvZJVi3noc7pOUqL"
      TZ: ${TZ}
    labels:
      meta.name: 'beszel-agent'
      meta.stack: 'admin'

