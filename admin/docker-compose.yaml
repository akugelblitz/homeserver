  gotify:
    image: gotify/server:latest
    container_name: 'gotify'
    restart: unless-stopped
    networks:
    - admin-network
    volumes:
      - gotify_data:/app/data
      # todo
    environment:
      TZ: ${TZ}
    labels:
      meta.name: 'gotify'
      meta.stack: 'admin'
      traefik.enable: 'true'
      traefik.http.services.gotify.loadbalancer.server.port: '80'
      traefik.http.routers.gotify.rule: 'Host(`gotify.${ROOT_FQDN}`)'
      traefik.http.routers.gotify.entrypoints: 'websecure'
      traefik.http.routers.gotify.tls: 'true'
 
  hoarder:
    image: ghcr.io/hoarder-app/hoarder:${HOARDER_VERSION:-release}
    container_name: 'hoarder'
    restart: unless-stopped
    networks:
    - admin-network
    volumes:
      - hoarder_data:/data
    environment:
      MEILI_ADDR: http://hoarder_meilisearch:7700
      BROWSER_WEB_URL: http://hoarder_chrome:9222
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATA_DIR: /data
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      NEXTAUTH_URL: hoarder.${ROOT_FQDN}
      TZ: ${TZ}
    labels:
      meta.name: 'hoarder'
      meta.stack: 'admin'
      traefik.enable: 'true'
      traefik.http.services.hoarder.loadbalancer.server.port: '3000'
      traefik.http.routers.hoarder.rule: 'Host(`hoarder.${ROOT_FQDN}`)'
      traefik.http.routers.hoarder.entrypoints: 'websecure'
      traefik.http.routers.hoarder.tls: 'true'   
      traefik.http.routers.hoarder.middlewares: 'authelia@docker'

  hoarder_chrome:
    image: gcr.io/zenika-hub/alpine-chrome:123
    container_name: 'hoarder_chrome'
    restart: unless-stopped
    networks:
    - admin-network
    environment:
      TZ: ${TZ}
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
    labels:
      meta.name: 'hoarder_chrome'
      meta.stack: 'admin'

  hoarder_meilisearch:
    image: getmeili/meilisearch:v1.11.1
    container_name: 'hoarder_meilisearch'
    restart: unless-stopped
    networks:
    - admin-network
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      TZ: ${TZ}
    volumes:
      - hoarder_meilisearch:/meili_data
    labels:
      meta.name: 'hoarder_meilisearch'
      meta.stack: 'admin'
  
  whoami:
    image: 'traefik/whoami'
    container_name: 'whoami'
    restart: 'unless-stopped'
    networks:
    - admin-network    
    labels:
      meta.name: 'whoami'
      meta.stack: 'admin'
      traefik.enable: 'true'
      traefik.http.services.whoami.loadbalancer.server.port: '80'
      traefik.http.routers.whoami.rule: 'Host(`whoami.${ROOT_FQDN}`)'
      traefik.http.routers.whoami.entrypoints: 'websecure'
      traefik.http.routers.whoami.tls: 'true'
      traefik.http.routers.whoami.middlewares: 'authelia@docker'


  authelia:
    image: 'authelia/authelia:4.38'
    container_name: 'authelia'
    user: "${UID}:${GID}"
    volumes:
      - './authelia/secrets:/secrets:ro'
      - './authelia/config:/config'
      - './authelia/logs:/var/log/authelia/'
    networks:
    - admin-network 
    labels:
      ## Expose Authelia through Traefik
      meta.name: 'authelia'
      meta.stack: 'admin'
      traefik.enable: 'true'
      traefik.http.services.auth.loadbalancer.server.port: '9091'
      traefik.http.routers.auth.rule: 'Host(`auth.${ROOT_FQDN}`)'
      traefik.http.routers.auth.entrypoints: 'websecure'
      traefik.http.routers.auth.tls: 'true'
      ## Setup Authelia ForwardAuth Middlewares
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth'
      # traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      # traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Name,Remote-Email'
    environment:
      TZ: ${TZ}
      X_AUTHELIA_CONFIG_FILTERS: 'template'  
  


