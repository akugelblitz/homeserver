networks:
  backbone-network:
    name: ${STACK}
    attachable: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${ADMIN_NET_SUBNET}
          ip_range: ${ADMIN_NET_SUBNET}
          

volumes:
  tailscale_data:
  traefik_certs:
  postgres_data:
  pihole_data:



services:
  tailscale:
    image: tailscale/tailscale:v1.76.6
    container_name: tailscale
    hostname: traefik
    restart: unless-stopped
    networks:
    - backbone-network
    # ports:
      # - "80:80"
      # - "443:443"
      # - "8080:8080"
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
      TZ: ${TZ}
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    labels:
      meta.name: 'tailscale'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.routers.traefik.rule: 'Host(`traefik.${ROOT_FQDN}`) '
      traefik.http.routers.traefik.entrypoints: 'websecure'
      traefik.http.routers.traefik.service: 'api@internal'
      traefik.http.services.traefik.loadbalancer.server.port: '8080'
      traefik.http.routers.traefik.tls: 'true'
      traefik.http.routers.traefik.tls.certresolver: 'letsencrypt'
      traefik.http.routers.traefik.tls.domains[0].main: '$ROOT_FQDN'
      traefik.http.routers.traefik.tls.domains[0].sans: '*.$ROOT_FQDN'
      # Authelia
      traefik.http.routers.traefik.middlewares: 'authelia@docker'
      traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth'
      ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest this is
      ## configured in the Session Cookies section of the Authelia configuration.
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F'
      traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Email,Remote-Name'

      # traefik.http.services.beszel.loadbalancer.server.port: '8090'
      # traefik.http.routers.beszel.rule: 'Host(`beszel.${ROOT_FQDN}`)'
      # traefik.http.routers.beszel.entrypoints: 'websecure'
      # traefik.http.routers.beszel.tls: 'true'
      # traefik.http.routers.beszel.service: 'beszel'

      
  traefik:
    image: traefik:v3.2.3
    container_name: 'traefik'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - tailscale
    network_mode: service:tailscale

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yaml:/etc/traefik/traefik.yaml
      - traefik_certs:/certs
      # - ./dynamic_conf.yml:/etc/traefik/dynamic_conf.yml
      # - ./traefik/acme.json:/acme.json
      # - ./traefik/traefik.log:/traefik.log
    environment:
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      TZ: ${TZ}
    labels:
      meta.name: 'traefik'
      meta.stack: ${STACK}
      # traefik.enable: 'true'
      # traefik.http.routers.traefik.rule: 'Host(`traefik.${ROOT_FQDN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))'
      # traefik.http.routers.traefik.entrypoints: 'websecure'
      # # traefik.http.routers.traefik.tls.certresolver: 'letsencrypt'
      # traefik.http.routers.traefik.service: 'api@internal'
      # traefik.http.services.traefik.loadbalancer.server.port: '8080'

      # Authelia
      # traefik.http.routers.api.middlewares: 'authelia@docker'
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth'
      # ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest this is
      # ## configured in the Session Cookies section of the Authelia configuration.
      # # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth?authelia_url=https%3A%2F%2Fauth.example.com%2F'
      # traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      # traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Email,Remote-Name'

  postgres:
    image: postgres:16.3
    command: ["bash", "-c", "docker-entrypoint.sh postgres & sleep 10 && sh /app/create-dbs.sh && tail -f /dev/null"]
    container_name: 'postgres'
    restart: unless-stopped
    networks:
    - backbone-network
    volumes:
      - ./postgres/scripts/:/app/
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${ADMIN_USER}
      POSTGRES_PASSWORD: ${ADMIN_PASS}
      PGPASSWORD: ${ADMIN_PASS}
      TZ: ${TZ}
    # post_start:
    #   - command: cat /app/seed.sql | PGPASSWORD=${ADMIN_PASS} psql -h localhost -U ${ADMIN_USER} -d ${POSTGRES_DB} -f-
    # post_start:
    #   - command: cat /app/seed.sql | PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f-
    #     user: root
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${ADMIN_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    labels:
      meta.name: 'postgres'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.tcp.services.postgres.loadbalancer.server.port: '5432'
      traefik.tcp.routers.postgres.rule: 'HostSNI(`postgres.${ROOT_FQDN}`)'
      traefik.tcp.routers.postgres.entrypoints: 'db'
      traefik.tcp.routers.postgres.tls: 'true'
      traefik.tcp.routers.postgres.tls.certresolver: 'letsencrypt'

  authelia:
    image: 'authelia/authelia:4.38'
    container_name: 'authelia'
    restart: unless-stopped
    user: "${UID}:${GID}"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    networks:
    - backbone-network 
    volumes:
      # - './authelia/secrets:/secrets:ro'
      - './authelia/config:/config'
      # - './authelia/logs:/var/log/authelia/'
    environment:
      TZ: ${TZ}
      X_AUTHELIA_CONFIG_FILTERS: 'template' 
    labels:
      ## Expose Authelia through Traefik
      meta.name: 'authelia'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.auth.loadbalancer.server.port: '9091'
      traefik.http.routers.auth.rule: 'Host(`auth.${ROOT_FQDN}`)'
      traefik.http.routers.auth.entrypoints: 'websecure'
      traefik.http.routers.auth.tls: 'true'
      ## Setup Authelia ForwardAuth Middlewares
      # traefik.http.middlewares.authelia.forwardAuth.address: 'http://authelia:9091/api/authz/forward-auth'
      # traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader: 'true'
      # traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders: 'Remote-User,Remote-Groups,Remote-Name,Remote-Email'


  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: ${HOSTNAME}
    restart: unless-stopped
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
    networks:
    - backbone-network 
    volumes:
      - pihole_data:/etc/pihole
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ''
      FTLCONF_dns_upstreams: '1.1.1.1;1.0.0.1'
      FTLCONF_dns_listeningMode: 'all'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    labels:
      meta.name: 'pihole'
      meta.stack: ${STACK}
      traefik.enable: 'true'
      traefik.http.services.pihole.loadbalancer.server.port: '80'
      traefik.http.routers.pihole.rule: 'Host(`pihole.${ROOT_FQDN}`)'
      traefik.http.routers.pihole.entrypoints: 'websecure'
      traefik.http.routers.pihole.tls: 'true'


