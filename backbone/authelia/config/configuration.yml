server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'
        authn_strategies:
          - name: 'HeaderAuthorization'
            schemes:
              - 'Basic'
              - 'Bearer'
          - name: 'CookieSession'

log:
  level: debug

theme: dark
      
totp:
  issuer: authelia.com

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 1
      salt_length: 16
      parallelism: 8
      memory: 64

access_control:
  default_policy: deny
  networks:
  - name: 'internal'
    networks:
      - '10.10.0.0/8'
      - '10.10.0.0/8'
      - '172.69.0.0/16'
  rules:
    - domain: 
      - 'homepage.kugel.homes'
      policy: bypass

    - domain: 
      - '*.kugel.homes'
      policy: one_factor
      subject:
      - 'group:admin'

    - domain: 
      - 'hoarder.kugel.homes'
      policy: one_factor
      subject:
      - 'group:user'

regulation:
  max_retries: 3
  find_time: '2m'
  ban_time: '5m'


password_policy:
  standard:
    enabled: false
    min_length: 8
    max_length: 0
    require_uppercase: false
    require_lowercase: false
    require_number: false
    require_special: false
  zxcvbn:
    enabled: false
    min_score: 2

identity_validation:
  reset_password:
    jwt_secret: a365782276778bef2808a9af188a66ebb580d80e1245f4c49387b03a161d747d36db0e29013f46df089aa15ebc7d4b6b440fe99d3f0c0715226d0e184e4fa90c
    jwt_lifespan: '5 minutes'
    jwt_algorithm: 'HS256'

session:
