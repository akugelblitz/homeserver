networks:
  backbone-network:
    name: backbone-network
    external: true

volumes:
  jellyfin_config:
  jellyfin_cache:

services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-latest}
    container_name: "jellyfin"
    restart: unless-stopped
    networks:
      - backbone-network
    user: 1000:1000
    group_add:
      - "989"
    volumes:
      - "jellyfin_config:/config"
      - "jellyfin_cache:/cache"
      - "${MEDIA_DIRECTORY}:/media"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card0
    environment:
      - TZ=${TZ}
    labels:
      meta.name: "jellyfin"
      meta.stack: ${STACK}
      traefik.enable: "true"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.${ROOT_FQDN}`)"
      traefik.http.routers.jellyfin.entrypoints: "websecure"
      traefik.http.routers.jellyfin.tls: "true"
      glance.name: Jellyfin
      glance.icon: /assets/jellyfin.svg
      glance.url: https://jellyfin.${ROOT_FQDN}
      glance.description: Media Server
